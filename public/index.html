<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Push‑to‑Talk · Audio Recorder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <div class="logo-wrap">
      <img src="dspcom.svg" alt="dspcom logo" class="logo" />
    </div>
    <h1><span>🎙️</span> Push‑to‑Talk</h1>

    <!-- SETTINGS -->
    <div class="settings-panel">
      <div class="settings-header">
        <span>⚙️ Settings</span>
        <button class="settings-toggle" id="settingsToggle" type="button" aria-label="Toggle settings">▾</button>
      </div>
      <div class="settings-body" id="settingsBody">
        <label class="settings-row">
          <span>Language</span>
          <select id="langSelect">
            <option value="ja">日本語 (Japanese)</option>
            <option value="fa">فارسی (Persian)</option>
            <option value="en">English</option>
          </select>
        </label>

        <label class="settings-row">
          <span>Model</span>
          <select id="modelSelect">
            <option value="base">base (fast)</option>
            <option value="small">small (more accurate)</option>
          </select>
        </label>
      </div>
    </div>

    <!-- PUSH TO TALK BUTTON -->
    <div class="ptt-area">
      <button class="ptt-button" id="pttButton" aria-label="Push to talk">
        <span class="mic-icon">🎤</span>
        <span id="pttLabel">HOLD</span>
      </button>
      <div class="ptt-hint">press &amp; hold to record</div>
      <div class="status-badge" id="statusBadge">ready</div>
    </div>

    <!-- RECORDINGS LIST -->
    <div class="recordings-section">
      <div class="recordings-header">
        <h2>📋 Recordings</h2>
        <span class="count" id="countBadge">0</span>
      </div>
      <div class="audio-list" id="audioList">
        <div class="empty-message">no recordings yet — hold the button</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
